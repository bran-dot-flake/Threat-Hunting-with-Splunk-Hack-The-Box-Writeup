<title id="title">Threat Hunting with Splunk — investigation timeline</title>
<desc id="desc">June 6, 2024. Ten chronological entries show download metadata, executable launch, C2 connection, attacker commands, PowerShell activity, and a firewall rule. Times match Splunk display time. Rows are equally spaced, not scaled by elapsed time.</desc>
